apply plugin: 'com.android.application'

// CueVR — ThumbyCue on a headset. A separate app from Mote VR: its own
// applicationId, its own icon, its own APK. The two share source, not identity.
android {
    namespace 'us.thumby.cuevr'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'us.thumby.cuevr'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-alpha'
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-29'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'jni/Android.mk' }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    buildTypes {
        release {
            // Sideloaded, not a store upload: the debug key keeps a keystore
            // out of the build.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}
