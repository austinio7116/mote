apply plugin: 'com.android.application'

/* Commits on HEAD. Monotonic, needs nobody to remember it, and falls back to a
 * clock-derived number if this is ever built outside a checkout — never to a
 * constant, which is the failure being fixed. */
def gitCount() {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
        }
        return out.toString().trim().toInteger()
    } catch (ignored) {
        return (int)(System.currentTimeMillis() / 60000L % 2000000000L)
    }
}

// CueVR — ThumbyCue on a headset. A separate app from Mote VR: its own
// applicationId, its own icon, its own APK. The two share source, not identity.
android {
    namespace 'us.thumby.cuevr'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'us.thumby.cuevr'
        /* 32 DROPS QUEST 1, which the store no longer accepts a title for.
         * com.oculus.supportedDevices already omits it, but that tag is what a
         * launcher reads rather than something the installer enforces — this is
         * the line that makes it true. Quest 1 never went past Android 10 (API
         * 29); Quest 2, Pro, 3 and 3S are all on Android 12L (API 32) or later,
         * so nothing that IS supported is shut out. */
        minSdk 32
        /* 34, NOT 35. The Horizon Store rejects anything above 34 — "Android
         * Target SDK version is 35, but should be 34 or lower". compileSdk
         * stays at 35: what is compiled against and what behaviour is opted
         * into are different questions, and only the latter is checked. */
        targetSdk 34
        // THE VERSION CODE COMES FROM GIT, and it has to.
        //
        // It sat at 2 through fifteen builds in a day, and a store or a sideload
        // manager that keys on versionCode — QGO does — sees the same number and
        // serves whatever it already has. The install looks like it worked and
        // the build is yesterday's. Nobody remembers to bump a constant fifteen
        // times, so it is counted rather than typed: one per commit, monotonic
        // by construction, and it cannot go backwards.
        versionCode gitCount()
        // The name stays human, and is what CUEVR_VERSION prints on the menu —
        // keep the two in step, because "which build are you on?" is the first
        // question when two headsets disagree.
        versionName '0.5'
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-29'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        ndkBuild { path 'jni/Android.mk' }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    /* THE RELEASE KEY, if this machine has it.
     *
     * A store will not take a debug-signed APK — "APK files must be signed with
     * a release key" — and the debug key was deliberate while this was only ever
     * sideloaded. So: sign with the real key when keystore.properties is there,
     * and fall back to debug when it is not, which keeps a fresh clone building
     * a sideloadable APK for anybody who has no key and does not need one.
     *
     * The file is gitignored and the keystore lives outside the repo. Neither
     * can go into git: this key IS the app's identity on the store, and an app
     * that has been published cannot be updated with a different one — so it is
     * lost forever exactly once. */
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
            /* ALL THREE SCHEMES. v2 alone satisfies every Android since 7, and
             * is what this signed with by default — but a store's validator is
             * not Android, it is somebody's checker, and the cheapest way to
             * find out which one it wants is to not make it choose. v1 costs a
             * few manifest entries; v3 is the modern one and carries rotation
             * if this key ever has to be replaced. */
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            /* Say WHICH, in the build log. A release that quietly falls back to
             * the debug key looks identical until a store rejects it, and the
             * upload is where you find out. */
            def signed = rootProject.file('keystore.properties').exists()
            signingConfig signed ? signingConfigs.release : signingConfigs.debug
            println signed ? "[cuevr] release signing: keystore.properties"
                           : "[cuevr] release signing: DEBUG KEY — not fit for a store upload"
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}
