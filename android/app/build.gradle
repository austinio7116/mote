apply plugin: 'com.android.application'

// Which ABIs and which games go in the APK. arm64-v8a alone; add x86_64 for the
// emulator.
//
// No games are bundled by default: the app downloads what you want from the
// gallery, which keeps the APK small and means a game is never two versions --
// one baked in, one installed. -PmoteGames=all bundles the lot (a ~12 MB APK),
// or name them: -PmoteGames="moita wormote".
def moteAbis  = (project.findProperty('moteAbis')  ?: 'arm64-v8a').split(',').collect { it.trim() }
def moteGames = (project.findProperty('moteGames') ?: 'none').trim()

android {
    namespace 'us.thumby.mote'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'us.thumby.mote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.21-alpha'   // tracks the Mote Studio release it ships with
        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-23'
                arguments += "MOTE_GAMES=${moteGames}".toString()
                abiFilters(*moteAbis)
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    sourceSets.main {
        // SDL ships its own Java glue with the source drop; use it in place
        // rather than vendoring a second copy that can drift.
        java.srcDirs += 'jni/SDL/android-project/app/src/main/java'
        // The chassis photo + its calibration are staged out of studio/assets
        // (see copyChassisAssets) rather than duplicated into the source tree.
        assets.srcDirs += "${buildDir}/generated/moteAssets"
    }

    packaging {
        jniLibs {
            // The launcher enumerates game modules with opendir() on the app's
            // native-library dir, so the modules must be real files on disk.
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            // Signed with the debug key: this is a sideloaded APK, not a Play
            // Store upload, and a keystore would just be a build-time hurdle.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        // lintVital would otherwise race the asset staging below for no benefit
        // to a sideloaded APK.
        checkReleaseBuilds false
    }
}

// The chassis photo, baked for the phone by android/tools/gen_chassis.py: a
// JPEG plus its alpha mask at 0.8 scale, and screen.cfg scaled to match. 240 KB
// where the full-resolution PNG pair was 7.8 MB, and still above 1:1 on the
// tallest phone in landscape. Regenerate after editing studio/assets.
task copyChassisAssets(type: Copy) {
    // Wipe first: Copy leaves whatever a previous build put here, and a stale
    // 3.6 MB thumby_color.png would ride along in the APK unnoticed.
    doFirst { delete "${buildDir}/generated/moteAssets" }
    from("${rootDir}/assets") {
        include 'thumby_color.jpg'
        include 'thumby_color_a.png'
        include 'screen.cfg'
    }
    into "${buildDir}/generated/moteAssets"
    doLast {
        ['thumby_color.jpg', 'thumby_color_a.png', 'screen.cfg'].each {
            if (!file("${buildDir}/generated/moteAssets/${it}").exists())
                throw new GradleException("missing baked asset ${it} -- run: python3 android/tools/gen_chassis.py")
        }
    }
}
// Every variant task runs after preBuild, so this one hook orders the staging
// ahead of asset merging, packaging and lint alike.
tasks.named('preBuild').configure { dependsOn copyChassisAssets }
