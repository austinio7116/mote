<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>CueVR online</title>
<style>
:root{--bg:#101418;--fg:#e4e8ec;--dim:#7d8790;--acc:#7fd4b4;--line:#242b33;--warn:#f0a070;--bad:#f07070;--card:#151a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.top{padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:18px;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--dim);text-decoration:none;font-size:14px;padding:5px 11px;border-radius:14px;border:1px solid transparent}
nav a.on{color:var(--acc);border-color:var(--acc)}
nav a .n{font-size:11px;background:var(--warn);color:#101418;border-radius:8px;padding:0 5px;margin-left:4px}
h2{font-size:13px;color:var(--acc);margin:18px 16px 6px;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:16px;margin:0 0 2px}
.card{margin:6px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tap{cursor:pointer}.tap:active{border-color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dim{color:var(--dim)}.acc{color:var(--acc)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.small{font-size:13px}.tiny{font-size:11.5px}
.chips{display:flex;gap:6px;margin:4px 16px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:13px;color:var(--dim);cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc)}
#tform label{display:flex;flex-direction:column;gap:4px;min-width:0}
#tform label.tick{flex-direction:row;align-items:center;gap:8px}
#tform input,#tform select{font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;box-sizing:border-box;max-width:100%}
#tform input{margin:0}
#tform input[type=date],#tform input[type=time]{min-width:160px}
#tf-title{width:100%}
#tform input[type=checkbox]{padding:0;width:18px;height:18px;accent-color:var(--acc)}
#tform input[type=color]{padding:0;width:44px;height:30px}
.card button{font:inherit;font-size:14px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:6px 14px;cursor:pointer}
.tag{font-size:11px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:400}
.tag.w{border-color:var(--warn);color:var(--warn)}.tag.d{border-color:var(--dim);color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:6px 16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.stat b{display:block;font-size:19px;color:var(--acc);font-weight:600}.stat span{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:400}
td.r,th.r{text-align:right}
input{width:calc(100% - 32px);margin:6px 16px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.form span{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;margin:0 3px 3px 0;font-size:12px;font-weight:600;color:#101418;cursor:pointer}
.W{background:var(--acc)}.L{background:#3a434d;color:var(--fg)!important}
.bar{height:8px;border-radius:4px;background:var(--acc)}
.back{display:inline-block;margin:10px 16px 0;color:var(--acc);cursor:pointer;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 0;font:12px ui-monospace,monospace;color:var(--dim)}
svg{display:block}.key{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px}
.empty{color:var(--dim)}
</style></head><body>
<header><div class=top><h1>CueVR online</h1><span id=at class="dim small">...</span></div>
<nav id=nav></nav></header>
<div id=view></div>
<script>
const T = new URLSearchParams(location.search).get('t') || '';
const q = p => p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(T);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* the server's times are UTC; shown in the phone's own time */
const D = s => new Date(String(s).replace(' UTC','').replace(' ','T') + (String(s).includes('+') ? '' : 'Z'));
const lt = (s, day) => { const d = D(s); if (isNaN(d)) return e(s);
  const hm = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return day ? d.toLocaleDateString([], {day:'numeric', month:'short'}) + ' ' + hm : hm; };
const ago = s => { const m = (Date.now() - D(s)) / 60000; if (isNaN(m)) return '';
  return m < 1 ? 'just now' : m < 60 ? Math.round(m) + ' min ago' : m < 1440 ? Math.round(m/60) + ' h ago' : Math.round(m/1440) + ' d ago'; };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '-';
const frac = (a, b) => b ? `${pct(a,b)} <span class="dim tiny">${a}/${b}</span>` : '<span class=dim>-</span>';
const mins = s => s >= 3600 ? (s/3600).toFixed(1) + ' h' : Math.round(s/60) + ' min';
const empty = t => `<div class="card empty">${t}</div>`;
let NOW = null, M = null, MT = 0, DP = {}, DM = {}, S = null, H = null, HD = 1, PQ = '', MG = '', MQ = '', SF = false;

const TABS = [['now','Now'],['players','Players'],['ratings','Ratings'],['matches','Matches'],['honours','Honours'],['tourn','Tournaments'],['integrity','Integrity'],['activity','Activity'],['server','Server']];
function route(){ const h = location.hash.slice(1) || 'now'; const [v, a] = h.split('/'); return {v, a: decodeURIComponent(a || '')}; }
function nav(){
  const r = route(), base = {player:'players', match:'matches'}[r.v] || r.v;
  const W = M && M.integrity.walkout_flags || {leavers: [], winners: [], pairs: []};
  const flags = M ? M.integrity.disputed.filter(d => !d.repaired).length + M.integrity.unconfirmed.length + M.integrity.same_addr.length + M.integrity.lopsided.length
                    + W.leavers.length + W.winners.length + W.pairs.length : 0;
  document.getElementById('nav').innerHTML = TABS.map(([k,l]) =>
    `<a href="#${k}" class="${base==k?'on':''}">${l}${k=='integrity'&&flags?`<span class=n>${flags}</span>`:''}</a>`).join('');
}
function draw(){
  nav();
  const r = route(), V = document.getElementById('view');
  const f = {now:vNow, players:vPlayers, player:vPlayer, ratings:vRatings, matches:vMatches, match:vMatch, honours:vHonours,
             integrity:vIntegrity, activity:vActivity, server:vServer, tourn:vTourn}[r.v] || vNow;
  const y = window.scrollY, keep = V.dataset.v === location.hash;
  V.innerHTML = f(r.a); V.dataset.v = location.hash;
  if (keep) window.scrollTo(0, y);
  const inp = document.getElementById('srch');
  if (inp && SF) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); draw(); load(); });

/* ---- TOURNAMENTS (7.5): the relay runs them; they are made here ------------ */
let TN = null, TMSG = '';
const TGAMES = [[0, 'UK 8-ball'], [2, '9-ball'], [6, 'Snooker, 6 reds']];
const TCLOTH = ["Black","Silver","Taupe","Tan","Gold","Paprika","Nutmeg","Ranger green","Olive","Championship","Sage","Powder blue","Slate","Navy","Royal blue","Teal","Yellow","Purple","Light purple","Tournament blue","Windsor red","Red","Orange","Pink"];
const TFRAME = ["Walnut","Oak","Mahogany","Wenge","Ebony","Charcoal","Silver","Tournament","Rosewood","Cherry","Teak","Maple","Burgundy","Grey oak","Racing green","Navy"];
const TBALLS = ["Pro","UK yellow/blue","UK yellow/red","Dyna","Pro tour","Hot pink","Space","Vintage","Pyramid","Bar billiards"];
function tdefault(){
  const d = new Date(Date.now() + 2 * 86400000); d.setHours(20, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  return {title: '', kind: 0, size: 8, race: 2, frace: 3, day: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time: '20:00',
          closes: 0, cloth: 9, frame: 7, set: 0, useLeather: false, leather: '#5a2e14', useMetal: false, metal: '#c8a040'};
}
let TF = tdefault();
function tset(k, v){ TF[k] = v; }
const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}"${+v === +cur ? ' selected' : ''}>${e(l)}</option>`).join('');
function vTourn(){
  if (!TN) return empty('Loading...');
  let h = TN.err ? `<div class="card bad small">The relay did not answer (${e(TN.err)})</div>` : '';
  const on = (TN.list || []).filter(t => t.status != 'done' && t.status != 'off'), past = (TN.list || []).filter(t => t.status == 'done' || t.status == 'off');
  const game = k => (TGAMES.find(g => g[0] == k) || [k, 'game ' + k])[1];
  const card = t => `<div class=card><div class=row><b>${e(t.title)}</b><span class="small ${t.status=='running'?'acc':t.status=='off'?'bad':'dim'}">${e(t.status)}</span></div>
      <div class="small dim">${new Date(t.start * 1000).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}
        &middot; ${e(game(t.kind))} &middot; ${t.size} players &middot; race to ${(t.best_of+1)/2}, final to ${(t.final_best_of+1)/2}</div>
      <div class=small>${t.nent} entered${t.entrants.length ? ': ' + t.entrants.map(e).join(', ') : ''}</div>
      ${(t.status == 'open' || t.status == 'room') && TN.can_create ? `<div style="margin-top:6px"><button id="tc${t.tid}" onclick="tcancel(${t.tid})">Call it off</button></div>` : ''}</div>`;
  h += '<h2>Coming up and on now</h2>' + (on.length ? on.map(card).join('') : empty('None. Make one below.'));
  if (!TN.can_create) h += '<div class="card warn small">Making tournaments is off on this server: it has no admin token yet.</div>';
  else {
    h += `<h2>New tournament</h2><form id=tform class=card onsubmit="tcreate(event)" style="display:grid;gap:10px">
      <label class=small>Title<input id=tf-title maxlength=40 value="${e(TF.title)}" oninput="tset('title',this.value)" placeholder="Friday knockout"></label>
      <label class=small>Game<select id=tf-kind onchange="tset('kind',+this.value)">${opts(TGAMES, TF.kind)}</select></label>
      <div class=row style="gap:12px;flex-wrap:wrap">
        <label class=small>Players<select id=tf-size onchange="tset('size',+this.value)">${opts([[4,'4'],[8,'8'],[16,'16']], TF.size)}</select></label>
        <label class=small>Race to<select id=tf-race onchange="tset('race',+this.value)">${opts([1,2,3,4,5].map(n => [n, n]), TF.race)}</select></label>
        <label class=small>Final race to<select id=tf-frace onchange="tset('frace',+this.value)">${opts([1,2,3,4,5,6,7].map(n => [n, n]), TF.frace)}</select></label>
      </div>
      <div class=row style="gap:12px;flex-wrap:wrap">
        <label class=small>Day<input id=tf-day type=date value="${TF.day}" onchange="tset('day',this.value)"></label>
        <label class=small>Start (your time)<input id=tf-time type=time value="${TF.time}" onchange="tset('time',this.value)"></label>
        <label class=small>Entries close<select id=tf-closes onchange="tset('closes',+this.value)">${opts([[0,'at the start'],[15,'15 min before'],[60,'1 hour before'],[1440,'the day before']], TF.closes)}</select></label>
      </div>
      <div class=row style="gap:12px;flex-wrap:wrap">
        <label class=small>Cloth<select id=tf-cloth onchange="tset('cloth',+this.value)">${opts(TCLOTH.map((n,i) => [i, n]), TF.cloth)}</select></label>
        <label class=small>Timber<select id=tf-frame onchange="tset('frame',+this.value)">${opts(TFRAME.map((n,i) => [i, n]), TF.frame)}</select></label>
        <label class=small>Balls<select id=tf-set onchange="tset('set',+this.value)">${opts(TBALLS.map((n,i) => [i, n]), TF.set)}</select></label>
      </div>
      <div class=row style="gap:12px;flex-wrap:wrap">
        <label class="small tick"><input id=tf-ul type=checkbox ${TF.useLeather?'checked':''} onchange="tset('useLeather',this.checked)"> Leather <input id=tf-leather type=color value="${TF.leather}" onchange="tset('leather',this.value)"></label>
        <label class="small tick"><input id=tf-um type=checkbox ${TF.useMetal?'checked':''} onchange="tset('useMetal',this.checked)"> Fittings <input id=tf-metal type=color value="${TF.metal}" onchange="tset('metal',this.value)"></label>
      </div>
      <div class="tiny dim">The balls are used where the game allows them; otherwise the game's own. Entrants must be on CueVR 7.5.</div>
      <div><button id=tf-go type=submit>Make it</button> <span id=tf-msg class=small>${e(TMSG)}</span></div>
    </form>`;
  }
  h += '<h2>Finished</h2>' + (past.length ? past.slice(-10).reverse().map(card).join('') : empty('None yet.'));
  return h;
}
async function tpost(path, body){
  const r = await fetch(q(path), {method: 'POST', body: body ? JSON.stringify(body) : '', cache: 'no-store'});
  let d = {}; try { d = await r.json(); } catch (x) {}
  return {ok: r.ok, d};
}
async function tcreate(ev){
  ev.preventDefault();
  const start = Math.floor(new Date(TF.day + 'T' + TF.time).getTime() / 1000);
  const style = {cloth: TF.cloth, frame: TF.frame, set: TF.set};
  if (TF.useLeather) style.leather = TF.leather; if (TF.useMetal) style.metal = TF.metal;
  const spec = {title: TF.title, kind: TF.kind, rules: 0, size: TF.size, best_of: 2 * TF.race - 1, final_best_of: 2 * TF.frace - 1,
                start, close: start - 60 * TF.closes - (TF.closes ? 0 : 60), style};
  document.getElementById('tf-msg').textContent = 'Making it...';
  const {ok, d} = await tpost('api/tourn', spec);
  TMSG = ok ? `Made: tournament ${d.tid}. It is on the board in the club now.` : (d.error || 'It did not work.');
  if (ok) TF = tdefault();
  document.activeElement && document.activeElement.blur(); await load();
}
async function tcancel(tid){
  const b = document.getElementById('tc' + tid);
  if (b.dataset.sure != '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to call it off'; return; }
  const {ok, d} = await tpost('api/tourn/cancel?tid=' + tid);
  TMSG = ok ? `Tournament ${tid} called off.` : (d.answer || d.error || 'It did not work.');
  await load();
}

/* ---- NOW ---------------------------------------------------------------- */
function vNow(){
  let h = '<h2>Now</h2>', any = false;
  if (!NOW) return h + empty('Loading...');
  for (const v of NOW.live){
    for (const c of v.clubs){ any = true;
      h += `<div class=card><div class=row><b>Club ${e(c.n)}</b><span class="dim small">${e(v.version)}</span></div>
            <div class="small dim">${c.have} of ${c.max} in, ${c.tables} table${c.tables==1?'':'s'} playing</div>
            <div class=small>${c.who.map(e).join(', ')||'<span class=dim>nobody named</span>'}</div></div>`; }
    for (const m of v.live){ any = true;
      h += `<div class=card><div class=row><b>Match</b><span class="dim small">${e(v.version)}</span></div><div class=small>${e(m)}</div></div>`; }
    for (const r of v.rooms){ any = true;
      h += `<div class=card><div class=row><b>Waiting</b><span class="dim small">${e(v.version)}</span></div><div class=small>${e(r)}</div></div>`; }
    if (v.error) h += `<div class="card warn small">${e(v.version)}: the relay did not answer (${e(v.error)})</div>`;
  }
  if (!any) h += empty('Nobody online right now.');
  if (M){ const td = M.activity.days.at(-1) || {};
    h += `<h2>Today (UTC)</h2><div class=grid>${st(td.frames||0,'frames kept')}${st(td.matches||0,'matches')}${st(td.players||0,'players')}${st(td.new||0,'new players')}</div>`; }
  return h + hChart();
}
const st = (v, l, cls) => `<div class=stat><b class="${cls||''}">${v}</b><span>${l}</span></div>`;
function hChart(){
  const d = H; let h = '<h2>Online over time</h2><div class=chips>' +
    [[1,'Day'],[7,'Week'],[30,'Month']].map(([n,l]) => `<span class="chip${HD==n?' on':''}" onclick="HD=${n};hload()">${l}</span>`).join('') + '</div>';
  if (!d) return h + empty('Loading...');
  const W = Math.min(window.innerWidth, 640) - 32 - 26, Hh = 150, P = 22;
  let mx = 1; for (const b of d.series) mx = Math.max(mx, b.club + b.match);
  const x = t => P + (t - d.from) / (d.to - d.from) * (W - P - 4), y = v => Hh - 18 - v / mx * (Hh - 30);
  const bw = Math.max(1, (W - P) * d.bucket / (d.to - d.from) - 1);
  let g = `<svg width=${W} height=${Hh}>`;
  for (const f of [0, 0.5, 1]){ const v = Math.round(mx * f), yy = y(v);
    g += `<line x1=${P} x2=${W} y1=${yy} y2=${yy} stroke="#242b33"/><text x=0 y=${yy+4} fill="#7d8790" font-size=10>${v}</text>`; }
  for (const b of d.series){ const xx = x(b.t);
    if (b.club) g += `<rect x=${xx} y=${y(b.club)} width=${bw} height=${y(0)-y(b.club)} fill="#7fd4b4"/>`;
    if (b.match) g += `<rect x=${xx} y=${y(b.club+b.match)} width=${bw} height=${y(b.club)-y(b.club+b.match)} fill="#f0a070"/>`; }
  const ticks = d.days == 7 ? 7 : 6;
  for (let i = 0; i <= ticks; i++){ const t = d.from + (d.to - d.from) * i / ticks, dt = new Date(t * 1000);
    const lab = d.days == 1 ? dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : dt.toLocaleDateString([], {day:'numeric', month:'short'});
    g += `<text x=${i == ticks ? W : x(t)} y=${Hh-3} fill="#7d8790" font-size=10 text-anchor=${i==0?'start':i==ticks?'end':'middle'}>${lab}</text>`; }
  g += '</svg>';
  h += `<div class=card>${d.series.length ? g : '<div class="dim small">No history yet: a sample is taken every minute.</div>'}
        <div class="small dim" style="margin-top:6px"><span class=key style="background:#7fd4b4"></span>in the club<span class=key style="background:#f0a070"></span>in matches</div></div>`;
  for (const r of d.daily.slice(0, HD == 1 ? 2 : HD)){
    const day = new Date(r.day + 'T12:00:00Z').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'});
    h += `<div class="card small"><div class=row><b>${day}</b><span class=dim>${r.players} player${r.players==1?'':'s'} seen</span></div>
          <div class=dim>Most at once ${r.peak}${r.peak ? ' at ' + new Date(r.peak_t*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</div></div>`; }
  return h;
}

/* ---- PLAYERS -------------------------------------------------------------- */
const P = id => M && M.players.find(p => p.id === id);
function pCard(p){
  const s = p.shot;
  return `<div class="card tap" onclick="location.hash='player/${encodeURIComponent(p.id)}'">
    <div class=row><b>${e(p.name)}${p.proved?'<span class=tag>account</span>':p.team?'<span class="tag d">team</span>':'<span class="tag w">name only</span>'}${p.left>=3?'<span class="tag w">'+p.left+' walk-outs</span>':''}</b><span class="dim small">${ago(p.last)}</span></div>
    <div class=small>Frames ${p.fwon}/${p.frames} (${pct(p.fwon,p.frames)}) &middot; matches ${p.mwon}/${p.matches}</div>
    <div class="small dim">Pot success ${pct(s.made,s.att)}${p.version?' &middot; '+e(p.version):''}${p.aka.length?' &middot; also '+p.aka.map(e).join(', '):''}</div></div>`;
}
function vPlayers(){
  if (!M) return empty('Loading...');
  const ql = PQ.toLowerCase(), hit = p => !ql || p.name.toLowerCase().includes(ql) || p.aka.some(a => a.toLowerCase().includes(ql));
  const ps = M.players.filter(p => !p.team && hit(p)), ts = M.players.filter(p => p.team && hit(p));
  let h = `<input id=srch placeholder="Find a player" value="${e(PQ)}" onfocus="SF=true" onblur="SF=false" oninput="PQ=this.value;draw()">`;
  h += `<h2>Players <span class=dim>(${ps.length})</span></h2>` + (ps.map(pCard).join('') || empty('Nobody matches.'));
  if (ts.length) h += `<h2>Doubles teams <span class=dim>(${ts.length})</span></h2>` + ts.map(pCard).join('');
  return h;
}
function vPlayer(id){
  const p = DP[id] || P(id); if (!p) return '<span class=back onclick="history.back()">&lsaquo; Back</span>' + empty(M ? 'No such player.' : 'Loading...');
  const s = p.shot, perf = p.frames || 1;
  let h = `<span class=back onclick="history.back()">&lsaquo; Players</span><div class=card><h3>${e(p.name)}</h3>
    <div class="small dim">${e(p.shown_id)}${p.version?' &middot; plays '+e(p.version):''} &middot; first ${lt(p.first,true)} &middot; last ${lt(p.last,true)}</div>
    ${p.aka.length?`<div class=small>Also played as ${p.aka.map(e).join(', ')}</div>`:''}
    ${p.unverified?`<div class="small warn">${p.unverified} frame${p.unverified==1?'':'s'} not verified</div>`:''}</div>`;
  h += `<div class=grid>${st(pct(p.fwon,p.frames),`frames won, ${p.fwon} of ${p.frames}`)}${st(pct(p.mwon,p.matches),`matches won, ${p.mwon} of ${p.matches}`)}
    ${st(pct(s.made,s.att),`pot success, ${s.made} of ${s.att}`)}${st(pct(s.long_made,s.long_att),`long pots, ${s.long_made} of ${s.long_att}`)}
    ${p.carom_strokes ? st(pct(p.carom_cannons,p.carom_strokes),`carom cannons, ${p.carom_cannons} of ${p.carom_strokes}`) : ''}
    ${st(pct(s.safe_ok,s.safeties),`safeties held, ${s.safe_ok} of ${s.safeties}`)}${st(s.bnr,'break-and-runs')}${st(s.runouts,'clearances')}
    ${st(pct(s.breaks_ok,s.breaks),`breaks that potted, of ${s.breaks}`)}${st(s.b50 + ' / ' + s.b100,'breaks of 50 / 100')}
    ${st((p.fouls/perf).toFixed(1),'fouls a frame')}${st(p.table_secs?mins(p.table_secs/perf):'-','at the table a frame')}
    ${st(p.left, 'walk-outs', p.left?'warn':'')}${st(p.disputes,'disputed frames', p.disputes?'warn':'')}</div>`;
  if (p.form.length) h += `<h2>Form, last ${p.form.length} matches</h2><div class="card form">${p.form.map(f => `<span class=${f.won?'W':'L'} onclick="location.hash='match/${f.id}'">${f.won?'W':'L'}</span>`).join('')}</div>`;
  h += `<h2>By game</h2><div class=card><table><tr><th>Game</th><th class=r>Frames</th><th class=r>Won</th><th class=r>Best</th></tr>
    ${p.games.map(g => `<tr><td>${e(g.game)}</td><td class=r>${g.f}</td><td class=r>${pct(g.w,g.f)}</td><td class=r>${g.best||'-'}</td></tr>`).join('')}</table></div>`;
  h += !p.opp ? `<h2>Head to head</h2>${empty('Loading...')}` : `<h2>Head to head</h2><div class=card><table><tr><th>Against</th><th class=r>Frames</th><th class=r>Matches</th></tr>
    ${p.opp.map(o => `<tr class=tap onclick="location.hash='player/${encodeURIComponent(o.id)}'"><td>${e(o.name)}</td><td class=r>${o.fw}-${o.f-o.fw}</td><td class=r>${o.mw}-${o.m-o.mw}</td></tr>`).join('')}</table></div>`;
  const ms = p.recent || M.matches.filter(m => m.ids.includes(p.id)).slice(0, 30);
  h += `<h2>Matches</h2>` + (ms.map(mCard).join('') || empty('None kept.'));
  return h;
}

/* ---- MATCHES -------------------------------------------------------------- */
function mCard(m){
  const w = m.winner===0||m.winner===1 ? m.names[m.winner] : '';
  return `<div class="card tap" onclick="location.hash='match/${m.id}'"><div class=row><span>${e(m.names[0])} <b class=acc>${(m.frames||[0,0])[0]}-${(m.frames||[0,0])[1]}</b> ${e(m.names[1])}</span><span class="dim small">${lt(m.time, true)}</span></div>
    <div class="small dim">${e(m.game)}${m.variant?' &middot; '+e(m.variant):''}${w?' &middot; '+e(w)+' won':''}${m.forfeit?' &middot; <span class=warn>'+e(m.left)+' left</span>':''}${m.verified?'':' &middot; <span class=warn>not verified</span>'}${m.repaired?' &middot; repaired':''}</div></div>`;
}
function vMatches(){
  if (!M) return empty('Loading...');
  const games = [...new Set(M.matches.map(m => m.game))];
  const ql = MQ.toLowerCase();
  const ms = M.matches.filter(m => (!MG || m.game == MG) && (!ql || m.names.some(n => n.toLowerCase().includes(ql))));
  let h = `<input id=srch placeholder="Find a player's matches" value="${e(MQ)}" onfocus="SF=true" onblur="SF=false" oninput="MQ=this.value;draw()">
    <div class=chips><span class="chip${!MG?' on':''}" onclick="MG='';draw()">All</span>${games.map(g => `<span class="chip${MG==g?' on':''}" onclick='MG=${JSON.stringify(g).replace(/'/g,"&#39;")};draw()'>${e(g)}</span>`).join('')}</div>`;
  h += `<h2>Matches <span class=dim>(${ms.length})</span></h2>` + (ms.slice(0, 150).map(mCard).join('') || empty('None match.'));
  if (ms.length > 150) h += `<div class="card dim small">The newest 150 shown; search to narrow.</div>`;
  return h;
}
function vMatch(id){
  const m = DM[id] || (M && M.matches.find(x => x.id === id));
  if (!m) return '<span class=back onclick="history.back()">&lsaquo; Back</span>' + empty(M ? 'No such match.' : 'Loading...');
  const w = m.winner===0||m.winner===1 ? m.names[m.winner] : '';
  let h = `<span class=back onclick="history.back()">&lsaquo; Matches</span><div class=card><h3>${e(m.names[0])} ${(m.frames||[0,0])[0]}-${(m.frames||[0,0])[1]} ${e(m.names[1])}</h3>
    <div class="small dim">${e(m.game)}${m.variant?' &middot; '+e(m.variant):''} &middot; best of ${m.best_of} &middot; ${lt(m.time,true)} &middot; room ${e(m.room)}${m.room_secs?' &middot; room open '+mins(m.room_secs):''}</div>
    <div class=small>${w?e(w)+' won':''}${m.forfeit?' &middot; <span class=warn>'+e(m.left)+' left mid-frame</span>':''}${m.verified?' &middot; verified':' &middot; <span class=warn>not verified</span>'}${m.ver.filter(Boolean).length?' &middot; versions '+m.ver.filter(Boolean).map(e).join(' / '):''}</div>
    ${m.repaired?`<div class="small dim">Repaired: ${e(m.repaired)}</div>`:''}
    ${m.ids.map((i,k) => `<span class="chip" style="display:inline-block;margin:6px 6px 0 0" onclick="location.hash='player/${encodeURIComponent(i)}'">${e(m.names[k])} &rsaquo;</span>`).join('')}</div>`;
  if (!m.frame_list) return h + empty('Loading the frames...');
  for (const f of m.frame_list){
    const side = i => f.sides[i] || {}, sh = i => side(i).shot || {};
    h += `<div class=card><div class=row><b>Frame ${f.frame}</b><span class="small">${(f.score||[0,0]).some(Boolean)?`<b class=acc>${f.score.join('-')}</b> `:''}${f.winner===0||f.winner===1?e(m.names[f.winner])+' won':''}</span></div>
      <div class="tiny dim">${lt(f.time)}${f.secs?' &middot; '+mins(f.secs):''}${f.golden||(f.winner>=0&&f.winner<2&&(f.sides[f.winner]||{}).shots===1&&(f.sides[1-f.winner]||{}).shots===0)?' &middot; golden break':f.bnr>=0&&f.bnr!==null?' &middot; break-and-run':''}${f.forfeit?' &middot; forfeit':''}${f.figures===false?' &middot; no figures':''}</div>
      ${f.figures===false ? `<div class="small warn" style="margin-top:6px">${f.forfeit ? e(m.left || 'One player') + ' left after the frame had started: both games had said a shot was played. The game that stayed sent no figures, so this frame\'s shots and pots are not known.' : 'No figures were sent for this frame.'}</div></div>` : `
      <table><tr><th></th><th class=r>${e(m.names[0])}</th><th class=r>${e(m.names[1])}</th></tr>
      ${([18,19,20,21,22].includes(f.kind)
        ? [['Points', i => sh(i).points ?? '-'], ['Cannon success', i => frac(sh(i).scoring||0, sh(i).strokes||0)],
           ['Innings', i => sh(i).innings ?? '-'], ['Highest run', i => sh(i).top ?? '-'], ['Fouls', i => side(i).fouls ?? '-'],
           ['At the table', i => f.time_at && f.time_at[i] ? mins(f.time_at[i]) : '-']]
        : [['Best break', i => side(i).best ?? '-'], ['Breaks', i => (side(i).breaks||[]).join(', ') || '-'], ['Shots', i => side(i).shots ?? '-'],
         ['Potted', i => side(i).potted ?? '-'], ['Pot success', i => frac(sh(i).made||0, sh(i).att||0)], ['Long pots', i => frac(sh(i).long_made||0, sh(i).long_att||0)],
         ['Safeties held', i => frac(sh(i).safe_ok||0, sh(i).safeties||0)], ['Fouls', i => side(i).fouls ?? '-'],
         ['At the table', i => f.time_at && f.time_at[i] ? mins(f.time_at[i]) : '-']])
        .map(([l, g]) => `<tr><td class=dim>${l}</td><td class=r>${g(0)}</td><td class=r>${g(1)}</td></tr>`).join('')}</table></div>`}`;
  }
  if (!m.frame_list.length) h += empty('No frame lines for this match.');
  return h;
}

/* ---- HONOURS -------------------------------------------------------------- */
// RATINGS (Mark, 2026-10-12): Elo from 1500, K 30, over every verified singles
// frame between two proved accounts -- overall, and a table a game
let RG = 'all';
function vRatings(){
  if (!M || !M.ratings) return empty('Loading...');
  const R = M.ratings;
  const games = [['all', 'All games', R.all.length]].concat(R.games.map(g => [String(g.kind), g.game, g.players]));
  const rows = RG === 'all' ? R.all : ((R.games.find(g => String(g.kind) === RG) || {}).rows || []);
  let h = `<div class="small dim" style="margin:4px 2px 8px">Elo from ${R.start}, K ${R.k}: every verified one-against-one frame, in the order played. A forfeit counts as a win for the one who stayed.</div>`;
  h += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${games.map(([k, l, n]) =>
        `<a class="chip ${k === RG ? 'on' : ''}" style="cursor:pointer;padding:4px 10px;border-radius:12px;border:1px solid ${k === RG ? 'var(--acc)' : 'var(--line)'};color:${k === RG ? 'var(--acc)' : 'var(--dim)'}" onclick="RG='${k}';draw()">${e(l)} <span class=tiny>${n}</span></a>`).join('')}</div>`;
  if (!rows.length) return h + empty('No rated frames yet.');
  h += `<div class=card><table><tr><th></th><th>Player</th><th class=r>Rating</th><th class=r>Frames</th><th class=r>Peak</th><th class=r>Last</th></tr>
    ${rows.map((r, i) => `<tr class=tap onclick="location.hash='player/${encodeURIComponent(r.id)}'"><td class=dim style="width:24px">${i + 1}</td><td>${e(r.name)}</td>
      <td class=r><b class=acc>${r.r}</b></td><td class=r>${r.f}</td><td class="r dim">${r.peak}</td>
      <td class="r ${r.last > 0 ? 'acc' : r.last < 0 ? 'bad' : 'dim'}">${r.last > 0 ? '+' : ''}${r.last}</td></tr>`).join('')}</table></div>`;
  return h;
}
function vHonours(){
  if (!M) return empty('Loading...');
  const H_ = M.honours, R = M.month_race;
  let h = H_.error ? `<div class="card warn small">The relay did not answer (${e(H_.error)}).</div>` : '';
  const mon = new Date(R.month + '-15T12:00:00Z').toLocaleDateString([], {month:'long', year:'numeric'});
  h += `<h2>${mon} so far</h2><div class="card small dim">This month's leaders: their plates are engraved when the month closes (00:00 UTC on the 1st).</div>`;
  for (const b of R.boards) h += `<div class=card><div class=row><b class=small>${e(b.title)}</b><span class=small>${b.top.length ? b.top.map((t,i) => `${i?'<span class=dim>':''}${e(t.name)} <b class=acc>${e(t.value)}</b>${i?'</span>':''}`).join(' &middot; ') : '<span class=dim>nobody yet</span>'}</span></div></div>`;
  if (R.win_rate_near.length) h += `<div class="card small dim">Short of 20 frames for the win rate: ${R.win_rate_near.map(([n,f]) => `${e(n)} ${f}`).join(', ')}</div>`;
  const pb = M.pot_board;
  if (pb){
    const pt = (b, title) => `<div class=card><div class=row><b class=small>${title}</b><span class="tiny dim">only you see this &middot; ${b.need}+ attempts</span></div>
      ${b.rows.length ? `<table>${b.rows.map((r,i) => `<tr><td class=dim style="width:24px">${i+1}</td><td>${e(r.name)}</td><td class=r><b class=acc>${r.pct}%</b> <span class="tiny dim">${r.made}/${r.att}</span></td></tr>`).join('')}</table>` : '<div class="dim small">nobody has enough attempts yet</div>'}
      ${b.short.length ? `<div class="tiny dim" style="margin-top:4px">Short of ${b.need}: ${b.short.map(([n,a]) => `${e(n)} ${a}`).join(', ')}</div>` : ''}</div>`;
    h += `<h2>Pot success</h2>${pt(pb.month, mon + ' so far')}${pt(pb.all, 'All time')}`;
  }
  h += '<h2>All time</h2>';
  for (const b of H_.boards){
    h += `<div class=card><b class=small>${e(b.title)}</b>${b.rows.length ? `<table>${b.rows.map(r => `<tr><td class=dim style="width:24px">${e(r.rank)}</td><td>${e(r.name)}</td><td class=r>${e(r.value)}</td></tr>`).join('')}</table>` : '<div class="dim small">empty</div>'}</div>`; }
  h += '<h2>Monthly winners</h2>' + (H_.months.length ? `<div class=card><table>${H_.months.map(x => `<tr><td class=dim>${e(x.month)}</td><td>${e(x.title)}</td><td>${e(x.name)}</td><td class=r>${e(x.value)}</td></tr>`).join('')}</table></div>` : empty('No month has closed yet.'));
  return h;
}

/* ---- INTEGRITY ------------------------------------------------------------ */
function sect(t, list, f, none){ return `<h2>${t} <span class=dim>(${list.length})</span></h2>` + (list.length ? list.map(f).join('') : empty(none)); }
function vIntegrity(){
  if (!M) return empty('Loading...');
  const I = M.integrity;
  let h = `<div class="card small dim">Everything here is for review: a flag is a reason to look, not a finding.</div>`;
  h += sect('Disputed', I.disputed, d => `<div class=card><div class=row><span>${e(d.names[0])} v ${e(d.names[1])}</span><span class="dim small">${lt(d.time,true)}</span></div>
      <div class="small dim">${e(d.game)} &middot; ${e(d.t)} ${e(d.frame)} &middot; room ${e(d.room)}${d.verified?'':' &middot; not verified'}${d.same_addr?' &middot; <span class=warn>same address</span>':''}${d.repaired?' &middot; <span class=acc>repaired</span>':''}</div>
      <div class="tiny dim">Each line: what ${e(d.names[d.senders[0]] ?? 'one')}'s game said v what ${e(d.names[d.senders[1]] ?? 'the other')}'s said</div>
      <pre>${d.diff.length ? d.diff.map(e).join('\n') : 'no difference in the compared fields'}</pre></div>`, 'No disputes.');
  h += sect('Unconfirmed', I.unconfirmed, u => `<div class=card><div class=row><span>${e(u.names[0])} v ${e(u.names[1])}</span><span class="dim small">${lt(u.time,true)}</span></div>
      <div class="small dim">${e(u.game)} &middot; ${e(u.t)} ${e(u.frame)} &middot; sent by ${e(u.sender)} only &middot; ${u.strokes} strokes${u.stale?' &middot; held too long':''}</div></div>`, 'None.');
  {   const W = I.walkout_flags || {leavers: [], winners: [], pairs: []}, pl = x => `<span class=tap onclick="location.hash='player/${encodeURIComponent(x.id)}'">${e(x.name)} &rsaquo;</span>`;
      h += `<h2>Repeat walk-outs <span class=dim>(last 30 days)</span></h2>`;
      if (!W.leavers.length && !W.winners.length && !W.pairs.length) h += empty('Nobody has walked out of three frames, won three by walk-out, or walked out on the same player twice.');
      else {
        if (W.leavers.length) h += `<div class=card><b class=small>Left three or more frames under way</b><table>${W.leavers.map(x => `<tr><td>${pl(x)}</td><td class="r warn">${x.n} left</td><td class="r dim small">${x.bare ? x.bare + ' without figures' : ''}</td><td class="r dim small">${lt(x.last,true)}</td></tr>`).join('')}</table></div>`;
        if (W.winners.length) h += `<div class=card><b class=small>Won three or more by walk-out</b><table>${W.winners.map(x => `<tr><td>${pl(x)}</td><td class="r warn">${x.n} won</td><td class="r dim small">${lt(x.last,true)}</td></tr>`).join('')}</table></div>`;
        if (W.pairs.length) h += `<div class=card><b class=small>The same player walking out on the same opponent</b><table>${W.pairs.map(x => `<tr><td>${e(x.left)} &rarr; ${e(x.won)}</td><td class="r warn">${x.n} times</td><td class="r dim small">${lt(x.last,true)}</td></tr>`).join('')}</table><div class="tiny dim">A pair like this can be one friend handing another wins.</div></div>`;
      }
  }
  h += `<h2>Walk-outs <span class=dim>(${I.forfeits.length})</span></h2>`;
  if (I.left_counts.length) h += `<div class="card small">${I.left_counts.map(([n,c]) => `<span class=${c>=3?'warn':''}>${e(n)} ${c}</span>`).join(' &middot; ')}</div>`;
  h += I.forfeits.length ? I.forfeits.map(mCard).join('') : empty('Nobody has left a frame under way.');
  h += sect('Same address both sides', I.same_addr, x => `<div class=card><div class=row><span>${e(x.names.join(' v '))}</span><span class="dim small">${lt(x.time,true)}</span></div><div class="small dim">${e(x.game)} &middot; ${e(x.t)} &middot; room ${e(x.room)}</div></div>`, 'None: every kept result came from two addresses.');
  h += sect('One-sided days', I.lopsided, x => `<div class=card><div class=row><span>${e(x.names.join(' v '))}</span><span class="dim small">${e(x.day)}</span></div><div class="small dim">${x.frames} frames in a day, ${x.top} won by one side</div></div>`, 'No pair played 10 frames in a day with 90% going one way.');
  h += sect('Worth a look', I.notable, x => `<div class=card><div class=row><span class=small>${e(x.what)}</span><span class="dim small">${lt(x.time,true)}</span></div><div class="tiny dim">${e(x.game)} &middot; room ${e(x.room)}</div></div>`, 'Nothing unusual: no 20-pot frames without a miss, no frames under 45 s.');
  if (S){ const pf = S.recent.filter(r => r.kind == 'proof' || r.kind == 'honours');
    h += sect('Proof problems', pf, r => `<div class="card small"><div class=row><span>${e(r.msg)}</span><span class=dim>${lt(r.time,true)}</span></div></div>`, `None in the last 7 days (${S.proofs.good} good room proofs).`); }
  h += sect('Not verified', I.unverified, mCard, 'Every kept match was verified (both Meta accounts proved).');
  h += sect('Player reports', I.reports, r => `<div class="card small"><div class=row><span>${r.fields.map(e).join(' &middot; ')}</span><span class=dim>${e(r.time)}</span></div></div>`, 'No reports.');
  return h;
}

/* ---- ACTIVITY ------------------------------------------------------------- */
function bars(rows, fmt){ const mx = Math.max(1, ...rows.map(r => r[1]));
  return `<table>${rows.map(([l, v, x]) => `<tr><td style="width:38%">${e(l)}</td><td><div class=bar style="width:${Math.max(2, 100*v/mx)}%"></div></td><td class=r style="width:52px">${fmt ? fmt(v, x) : v}</td></tr>`).join('')}</table>`; }
function vActivity(){
  if (!M) return empty('Loading...');
  const A = M.activity, t = A.totals;
  let h = `<h2>Since ${lt(t.since, true)}</h2><div class=grid>${st(t.frames,'frames kept')}${st(t.matches,'matches')}${st(t.players,'players')}${st(t.accounts,'proved accounts')}${st(mins(A.room_secs_median),'median room time')}</div>`;
  const days = A.days.filter((d, i) => i >= A.days.findIndex(x => x.frames || x.matches) && A.days.findIndex(x => x.frames || x.matches) >= 0);
  h += '<h2>Frames a day</h2><div class=card>' + (days.length ? bars(days.slice().reverse().map(d => [new Date(d.day + 'T12:00:00Z').toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'}), d.frames, d]),
       (v, d) => `${v}<span class="dim tiny"> ${d.players}p</span>`) : '<span class=dim>none yet</span>') + '<div class="tiny dim" style="margin-top:4px">p = players that day</div></div>';
  const off = -new Date().getTimezoneOffset() / 60, hl = [];
  for (let i = 0; i < 24; i++){ const u = ((i - off) % 24 + 24) % 24; hl.push([String(i).padStart(2,'0') + ':00', A.hours_utc[Math.round(u) % 24]]); }
  h += '<h2>Busiest hours (your time)</h2><div class=card>' + bars(hl.filter(r => r[1])) + '</div>';
  h += '<h2>Games, last 7 days</h2><div class=card>' + (A.games7.length ? bars(A.games7) : '<span class=dim>none</span>') + '</div>';
  h += '<h2>Games, all time</h2><div class=card>' + bars(A.games) + '</div>';
  h += '<h2>Frame length (median)</h2><div class=card>' + bars(A.frame_secs.map(([g, s, n]) => [g, s, n]), (s, n) => `${mins(s)}<span class="dim tiny"> ${n}</span>`) + '</div>';
  h += '<h2>Versions in use (last 14 days)</h2><div class=card>' + (A.versions.length ? bars(A.versions) : '<span class=dim>none</span>') + '</div>';
  const nd = A.days.filter(d => d.new);
  h += '<h2>New players</h2><div class=card>' + (nd.length ? bars(nd.slice().reverse().map(d => [new Date(d.day + 'T12:00:00Z').toLocaleDateString([], {day:'numeric', month:'short'}), d.new])) : '<span class=dim>none in 30 days</span>') + '</div>';
  return h;
}

/* ---- SERVER --------------------------------------------------------------- */
function size(b){ return b > 1e6 ? (b/1e6).toFixed(1) + ' MB' : b > 1e3 ? Math.round(b/1e3) + ' kB' : b + ' B'; }
function vServer(){
  if (!S) return empty('Loading...');

    ${st(y.load ? y.load[0] : '-','load (1 min)')}${st(y.mem_total_mb ? Math.round(100*(1-y.mem_avail_mb/y.mem_total_mb)) + '%' : '-','memory used')}
    ${st(y.disk_total_gb ? y.disk_free_gb + ' GB' : '-','disk free')}${st(S.restarts.length,'relay restarts, 7 days')}</div>`;
  h += `<h2>Last 7 days</h2><div class=card style="overflow-x:auto"><table><tr><th>Day</th><th class=r>Rooms</th><th class=r>Clubs</th><th class=r>Joins</th><th class=r>Agreed</th><th class=r>Disp.</th><th class=r>Left</th><th class=r>Err.</th></tr>
    ${S.days.map(d => `<tr><td>${new Date(d.day + 'T12:00:00Z').toLocaleDateString([], {weekday:'short', day:'numeric'})}</td><td class=r>${d.hosted}</td><td class=r>${d.clubs}</td><td class=r>${d.joins}</td><td class=r>${d.agreed}</td><td class="r ${d.disputed?'warn':''}">${d.disputed}</td><td class="r ${d.forfeits?'warn':''}">${d.forfeits}</td><td class="r ${d.errors?'bad':''}">${d.errors}</td></tr>`).join('')}</table>
    <div class="tiny dim" style="margin-top:4px">Agreed = frames and matches kept. Left = walk-outs (forfeits).</div></div>`;
  h += `<h2>Proofs, 7 days</h2><div class="card small">Rooms: ${S.proofs.good} good, <span class=${S.proofs.bad?'warn':''}>${S.proofs.bad} refused</span>, <span class=${S.proofs.unchecked?'warn':''}>${S.proofs.unchecked} not checked</span><br>
    Honours: ${S.honours_proofs.good} good, ${S.honours_proofs.bad} refused, ${S.honours_proofs.unchecked} not checked</div>`;
  h += '<h2>Why people left, 7 days</h2><div class=card>' + (S.leaves.length ? bars(S.leaves) : '<span class=dim>none</span>') + '</div>';
  h += `<h2>Events <span class=dim>(${S.recent.length})</span></h2>` + (S.recent.length ? S.recent.slice(0, 60).map(r => `<div class="card small"><div class=row><span class="${r.kind=='error'?'bad':r.kind=='restart'?'acc':'warn'}">${e(r.kind)}</span><span class=dim>${lt(r.time,true)}</span></div><div class=dim>${e(r.msg)}</div></div>`).join('') : empty('Nothing notable.'));
  h += `<h2>Data files</h2><div class=card><table>${S.files.map(f => `<tr><td>${e(f.name)}</td><td class=r>${f.dir ? f.size + ' files' : size(f.size)}${f.lines!=null?'<span class="dim tiny"> '+f.lines+' lines</span>':''}</td><td class="r dim">${lt(new Date(f.mtime*1000).toISOString().slice(0,19).replace('T',' '),true)}</td></tr>`).join('')}</table></div>`;
  const sn = S.snapshots || [], age = sn.length ? (Date.now()/1000 - sn[0].mtime) / 3600 : 1e9;
  h += `<h2>Daily snapshots <span class=dim>(${sn.length})</span></h2>` + (sn.length ? `<div class=card>${age > 30 ? '<div class="small warn">The newest snapshot is ' + Math.round(age) + ' h old</div>' : ''}<table>${sn.slice(0, 10).map(f => `<tr><td class=small>${e(f.name)}</td><td class=r>${size(f.size)}</td></tr>`).join('')}</table>${sn.length > 10 ? `<div class="tiny dim">and ${sn.length - 10} older</div>` : ''}</div>` : `<div class="card warn small">No daily snapshot yet.</div>`);
  h += `<h2>Backups beside the data</h2>` + (S.backups.length ? `<div class=card><table>${S.backups.map(f => `<tr><td class=small>${e(f.name)}</td><td class=r>${size(f.size)}</td></tr>`).join('')}</table></div>` : empty('None.'));
  h += `<h2>Code deployed</h2><div class=card><table>${S.code.map(c => `<tr><td>${e(c.name)}</td><td class=dim>${e(c.sha)}</td><td class="r dim">${lt(new Date(c.mtime*1000).toISOString().slice(0,19).replace('T',' '),true)}</td></tr>`).join('')}</table></div>`;
  return h;
}

/* ---- loading ---------------------------------------------------------------- */
async function get(p){ const r = await fetch(q(p), {cache:'no-store'}); if (!r.ok) throw new Error(r.status); return r.json(); }
let busy = false;
async function load(){
  if (busy) return; busy = true;
  const v = route().v;
  try {
    const jobs = [get('api').then(d => { NOW = d; document.getElementById('at').textContent = lt(d.at); })];
    if (!M || Date.now() - MT > 55000) jobs.push(get('api/model').then(d => { M = d; MT = Date.now(); }));
    if (v == 'server' || v == 'integrity') jobs.push(get('api/server').then(d => S = d));
    if (v == 'tourn') jobs.push(get('api/tourn').then(d => { TN = d; TN.err = null; }).catch(x => { TN = TN || {list: []}; TN.err = String(x.message); }));
    const a = route().a;
    if (v == 'player' && a) jobs.push(get('api/player?id=' + encodeURIComponent(a)).then(d => DP[a] = d).catch(() => {}));
    if (v == 'match' && a && !DM[a]) jobs.push(get('api/match?id=' + encodeURIComponent(a)).then(d => DM[a] = d).catch(() => {}));
    await Promise.all(jobs);
  } catch (x) { document.getElementById('at').textContent = String(x.message) == '403' ? 'refused' : 'no connection'; }
  busy = false;
  const a = document.activeElement; if (!(a && (a.id == 'srch' || a.closest && a.closest('#tform')))) draw();
}
async function hload(){ try { H = await get('api/history?days=' + HD); if (route().v == 'now') draw(); } catch (x) {} }
draw(); load(); hload();
setInterval(load, 15000); setInterval(hload, 60000);
window.addEventListener('resize', () => { if (route().v == 'now') draw(); });
</script></body></html>
